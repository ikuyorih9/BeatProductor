<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat Productor</title>
  <meta name="description" content="Criação rápida de beats e sequências em um piano roll.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f172a'/%3E%3Crect x='6' y='8' width='8' height='4' rx='1' fill='%2338bdf8'/%3E%3Crect x='12' y='14' width='12' height='4' rx='1' fill='%23a78bfa'/%3E%3Crect x='8' y='20' width='6' height='4' rx='1' fill='%23f97316'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full bg-slate-950 text-slate-100 antialiased">
  <div id="app" class="flex h-screen flex-col">

    <!-- ===================== CABEÇALHO: a música ===================== -->
    <header class="flex flex-wrap items-end gap-x-3 gap-y-3 border-b border-slate-800 bg-slate-900 px-4 py-3">
      <h1 class="mr-1 self-center text-lg font-bold tracking-widest text-sky-400">BEAT&nbsp;PRODUCTOR</h1>

      <label class="control">
        <span class="control-label">Instrumento</span>
        <select id="instrument-select" class="control-input w-36" title="Instrumento das novas notas"></select>
      </label>

      <label class="control">
        <span class="control-label">Compasso</span>
        <select id="meter-select" class="control-input w-20" title="Fórmula de compasso da partitura (4/4, 3/4, 6/8…)"></select>
      </label>

      <label class="control">
        <span class="control-label">BPM (♩)</span>
        <input id="bpm-input" type="number" inputmode="numeric" class="control-input w-20" title="Semínimas (♩) por minuto, como na indicação de metrônomo da partitura. Em 6/8 com ♩. = N, use N × 1,5.">
      </label>

      <label class="control">
        <span class="control-label">Compassos</span>
        <input id="bars-input" type="number" inputmode="numeric" class="control-input w-20" title="Tamanho da sequência, em compassos">
      </label>

      <label class="control">
        <span class="control-label">Célula</span>
        <select id="division-select" class="control-input w-48" title="Figura de cada célula do grid — 1 clique = 1 dessa figura"></select>
      </label>

      <div class="control">
        <span class="control-label">Loop</span>
        <div class="flex items-center gap-2">
          <label class="flex h-9 cursor-pointer items-center gap-2 rounded-md border border-slate-700 bg-slate-800 px-3">
            <input id="loop-checkbox" type="checkbox" class="h-4 w-4 accent-sky-500">
            <span class="text-sm">Loop</span>
          </label>
          <input id="loops-input" type="number" inputmode="numeric" class="control-input w-16" title="Quantidade de repetições na exportação" aria-label="Quantidade de loops na exportação">
        </div>
      </div>

      <div class="ml-auto flex items-end gap-2">
        <button id="import-button" type="button" class="btn btn-secondary" title="Abrir um arquivo de projeto (.txt) — substitui o projeto atual">Importar</button>
        <button id="export-project-button" type="button" class="btn btn-secondary" title="Baixar o projeto como arquivo de texto (editável e reimportável)">Exportar projeto</button>
        <button id="export-button" type="button" class="btn btn-primary" title="Gerar e baixar o MP3 da sequência">Exportar MP3</button>
        <input id="import-file" type="file" accept=".txt,.beat,text/plain" class="hidden" aria-hidden="true" tabindex="-1">
      </div>
    </header>

    <!-- ===================== BARRA DE EDIÇÃO + MIXER ===================== -->
    <nav class="flex flex-wrap items-center gap-x-2 gap-y-2 border-b border-slate-800 bg-slate-900/60 px-4 py-2" aria-label="Edição">
      <div class="segmented" role="group" aria-label="Ferramenta">
        <button id="tool-draw" type="button" class="segmented-btn" title="Desenhar notas (D)">✎ Desenhar</button>
        <button id="tool-select" type="button" class="segmented-btn" title="Selecionar arrastando um retângulo (S) — Shift+arrastar também seleciona">⬚ Selecionar</button>
      </div>
      <button id="merge-button" type="button" class="btn btn-secondary btn-sm" disabled title="Une as notas selecionadas da mesma linha numa só (U)">UNIR</button>
      <button id="split-button" type="button" class="btn btn-secondary btn-sm" disabled title="Separa as notas selecionadas em células do grid (Shift+U)">SEPARAR</button>
      <span class="toolbar-divider" aria-hidden="true"></span>
      <button id="delete-button" type="button" class="btn btn-secondary btn-sm btn-icon" disabled title="Apagar as notas selecionadas (Delete)" aria-label="Apagar seleção">🗑</button>
      <button id="clear-button" type="button" class="btn btn-secondary btn-sm" title="Apagar as notas do instrumento selecionado">Limpar</button>
      <button id="clear-all-button" type="button" class="btn btn-secondary btn-sm" title="Apagar as notas de TODOS os instrumentos">Limpar tudo</button>
      <span class="hidden text-[11px] text-slate-500 2xl:inline">Ctrl+C / Ctrl+V cola no cursor · arraste ou ↑↓←→ movem a seleção</span>

      <div id="mixer" class="ml-auto flex flex-wrap items-center gap-x-4 gap-y-1" role="group" aria-label="Mixer (volume por instrumento)"></div>
    </nav>

    <!-- ===================== PIANO ROLL ===================== -->
    <main id="roll-scroll" class="relative flex-1 overflow-auto" aria-label="Grid de montagem">
      <div id="roll" class="relative w-max min-w-full">
        <!-- Régua (compassos) — clique para posicionar o cursor -->
        <div class="sticky top-0 z-30 flex h-6 bg-slate-900">
          <div class="keys-width sticky left-0 z-40 flex items-center border-b border-r border-slate-800 bg-slate-900 px-2 text-[10px] uppercase tracking-wider text-slate-500">nota</div>
          <div id="ruler" class="relative flex-none cursor-pointer border-b border-slate-800 bg-slate-900" title="Clique para mover o cursor">
            <div id="ruler-marker" class="ruler-marker"></div>
            <div id="end-flag" class="end-flag hidden">FIM</div>
          </div>
        </div>

        <div class="flex">
          <div id="piano-keys" class="keys-width sticky left-0 z-20 flex-none border-r border-slate-800 bg-slate-900"></div>
          <div id="grid" class="relative flex-none touch-none select-none">
            <div id="grid-rows"></div>
            <div id="grid-lines" class="pointer-events-none absolute inset-0"></div>
            <div id="notes-layer" class="absolute inset-0"></div>
            <div id="ghost-note" class="note note-ghost hidden"></div>
            <div id="selection-box" class="selection-box hidden"></div>
            <div id="end-marker" class="end-marker hidden" title="Fim da música (fim da última nota ou pausa)"></div>
            <div id="playhead" class="playhead"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===================== RODAPÉ (TRANSPORTE) ===================== -->
    <footer class="grid grid-cols-3 items-center border-t border-slate-800 bg-slate-900 px-4 py-3">
      <div class="text-xs text-slate-400">
        <span id="position-display" class="font-mono text-sm text-slate-200">1.1</span>
        <span class="mx-1 text-slate-600">|</span>
        <span id="clock-display" class="font-mono">0:00.0</span>
      </div>
      <div class="flex items-center justify-center gap-3">
        <button id="start-button" type="button" class="btn btn-secondary" title="Voltar ao início (Home)">⏮ INÍCIO</button>
        <button id="play-button" type="button" class="btn btn-primary min-w-[8rem]" title="Tocar / pausar (Espaço)">▶ PLAY</button>
        <button id="end-button" type="button" class="btn btn-secondary" title="Ir para o fim (End)">FIM ⏭</button>
      </div>
      <div id="status-display" class="text-right text-xs text-slate-500"></div>
    </footer>
  </div>

  <div id="toast-area" class="pointer-events-none fixed bottom-20 left-1/2 z-50 flex -translate-x-1/2 flex-col items-center gap-2" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
  <script>
    // Rede de segurança: se o app não iniciar (ex.: o navegador misturou arquivos antigos do cache
    // com os novos depois de uma atualização), recarrega UMA vez buscando todos os scripts de novo;
    // se ainda assim falhar, mostra o que fazer em vez de deixar a tela sem resposta. Também cobre o
    // navegador rodando a versão antiga inteira do cache (o número de versão não bate).
    (function () {
      var APP_BUILD = 4; // = APP_BUILD de js/config.js
      var KEY = 'beat-productor:recarregou';
      var failed = false;
      function started() { return !!window.__beatProductor && window.__beatProductor.build === APP_BUILD; }
      function recover() {
        if (failed || started()) return;
        failed = true;
        var retried = false;
        try { retried = sessionStorage.getItem(KEY) === '1'; sessionStorage.setItem(KEY, '1'); } catch (e) { retried = true; }
        if (!retried) {
          var urls = performance.getEntriesByType('resource')
            .map(function (entry) { return entry.name; })
            .filter(function (url) { return url.indexOf(location.origin) === 0 && /\.(m?js|css)(\?|$)/.test(url); });
          urls.push(location.origin + location.pathname.replace(/[^/]*$/, '') + 'js/main.js');
          Promise.all(urls.map(function (url) { return fetch(url, { cache: 'reload' }).catch(function () {}); }))
            .then(function () { location.reload(); });
          return;
        }
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;inset:auto 16px 16px 16px;z-index:9999;padding:14px 16px;border-radius:8px;'
          + 'background:#7f1d1d;color:#fff;font:14px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4)';
        box.textContent = 'O Beat Productor não conseguiu iniciar. Recarregue a página com Ctrl+F5 (ou Ctrl+Shift+R). '
          + 'Se continuar, feche e abra o app de novo.';
        document.body.appendChild(box);
      }
      window.addEventListener('error', function () { setTimeout(recover, 300); });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (started()) { try { sessionStorage.removeItem(KEY); } catch (e) {} } else { recover(); }
        }, 4000);
      });
    })();
  </script>
</body>
</html>
