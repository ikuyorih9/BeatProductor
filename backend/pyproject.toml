[project]
name = "beat-productor-backend"
version = "1.0.0"
description = "API de síntese e exportação de áudio do Beat Productor"
requires-python = ">=3.12,<3.15"  # faixa com wheels para todas as dependências fixadas

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # O TestClient do Starlette sugere migrar para "httpx2"; o httpx atual funciona normalmente.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
